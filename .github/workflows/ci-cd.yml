name: Docker Build and Kubernetes Validation

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t kubernetes-ci-cd-api:test .

      - name: Validate Kubernetes deployment YAML
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path

          for file in ["k8s/deployment.yaml", "k8s/service.yaml"]:
              with open(file, "r") as f:
                  yaml.safe_load(f)
              print(f"{file} is valid YAML")
          PY