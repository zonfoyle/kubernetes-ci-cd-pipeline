apiVersion: apps/v1
kind: Deployment

metadata:
  name: kubernetes-ci-cd-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: kubernetes-ci-cd-api

  template:
    metadata:
      labels:
        app: kubernetes-ci-cd-api

    spec:
      containers:
        - name: kubernetes-ci-cd-api
          image: zonfoyle/kubernetes-ci-cd-api:latest
          ports:
            - containerPort: 5000